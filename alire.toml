name = "sitefetchlib"
description = "Reusable Ada website mirroring library"
version = "0.1.0"

authors = ["Bent Bracke"]
maintainers = ["Bent Bracke <bent@bracke.dk>"]
maintainers-logins = ["bracke"]
licenses = "MIT OR Apache-2.0 WITH LLVM-exception"
long-description = "sitefetchlib is the reusable library crate behind sitefetch. It exposes the stable Sitefetch package for crawling, rewriting, direct downloads, robots policy, retry/cache behavior, progress diagnostics, and fetch statistics."

# Fill this with the canonical project URL when one exists.
website = "https://github.com/bracke/sitefetchlib"
tags = ["website", "mirror", "crawler", "http", "library"]

[[depends-on]]
gnat_native = "=15.2.1"

[[depends-on]]
httpclient = "*"

[[depends-on]]
regexp = "*"

[[depends-on]]
zlib = "*"

[[pins]]
httpclient = { path = "../httpclient" }

[[pins]]
regexp = { path = "../regexp" }

[[pins]]
zlib = { path = "../zlib" }

# Pins are root-only in Alire: this root builds zlib (directly and via
# httpclient), so it must pin zlib's own dependency cryptolib too.
[[pins]]
cryptolib = { path = "../cryptolib" }

# `ssllib` is httpclient's TLS backend, and its own dependencies come with it.
# Same reason as cryptolib above: Alire honours pins only in the root crate, so
# every root that builds this graph has to name them.
[[pins]]
ssllib = { path = "../ssllib" }

[[pins]]
truststores = { path = "../truststores" }

[[pins]]
hostkit = { path = "../hostkit" }

[build-profiles]
"*" = "development"
